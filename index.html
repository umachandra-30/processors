<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Processor Info Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Mobile Processor Lookup</h1>
    <input type="text" id="searchInputMobile" placeholder="Enter mobile processor name...">
    <div id="suggestionsMobile"></div>
    <div id="resultMobile"></div>

    <h1>Laptop Processor Lookup</h1>
    <input type="text" id="searchInputLaptop" placeholder="Enter laptop processor name...">
    <div id="suggestionsLaptop"></div>
    <div id="resultLaptop"></div>
  </div>

  <script src="mobile_processors.js"></script>       <!-- Mobile data -->
  <script src="script.js"></script>     <!-- Mobile script -->
  <script src="laptop_processors.js"></script>      <!-- Laptop data -->
  <script src="laptop.js"></script>     <!-- Laptop script -->
</body>
</html>
